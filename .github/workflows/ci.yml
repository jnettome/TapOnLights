name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            tools/tapo-probe

      - name: Install npm packages
        run: npm ci

      - name: Svelte and TypeScript checks
        run: npm run check

      - name: Build the UI (the app embeds it)
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Probe (format and clippy)
        working-directory: tools/tapo-probe
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

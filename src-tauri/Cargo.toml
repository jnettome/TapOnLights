[package]
name = "taponlights"
version = "0.2.0"
description = "Fast local tray controller for TP-Link Tapo smart bulbs on Windows"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jnettome/TapOnLights"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tapo = "0.12.2"
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
axum = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", features = ["windows-native"] }
argon2 = "0.6"
sha2 = "0.11"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
